<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="bee" src="bee.png" crossorigin="anonymous">
    <img id="flower" src="cornflower.png" crossorigin="anonymous">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- CORNFLOWER -->
    <a-image
      src="#flower"
      position="0 -0.18 0.02"
      width="0.9"
      height="0.9"
      material="shader: flat; transparent: true; alphaTest: 0.1;"
      animation__sway="
        property: rotation;
        from: 0 0 -2;
        to: 0 0 2;
        dur: 1800;
        dir: alternate;
        loop: true;
        easing: easeInOutSine;">
    </a-image>

    <!-- BUMBLEBEE -->
    <a-image
      src="#bee"
      position="0 0.02 0.05"
      width="0.5"
      height="0.38"
      material="shader: flat; transparent: true; alphaTest: 0.1;"
      animation__fly="
        property: position;
        from: 0 0.02 0.05;
        to: 0.22 0.28 0.05;
        dur: 2500;
        dir: alternate;
        loop: true;
        easing: easeInOutSine;"
      animation__tilt="
        property: rotation;
        from: 0 0 -8;
        to: 0 0 8;
        dur: 500;
        dir: alternate;
        loop: true;
        easing: easeInOutSine;">
    </a-image>

    <!-- FACT TEXT -->
    <a-plane
      position="0 -0.62 0.055"
      width="1.05"
      height="0.16"
      material="color: #ffffff; opacity: 0.85; transparent: true;">
    </a-plane>

    <a-text
      value="Cornflowers provide nectar for pollinators."
      color="#111111"
      align="center"
      width="1.2"
      position="0 -0.62 0.06">
    </a-text>

  </a-entity>

</a-scene>

</body>
</html>
