<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>

  <script>
    AFRAME.registerComponent('bee-flight', {
      init: function () {
        this.fact = document.querySelector('#factGroup');
        this.pollen = document.querySelectorAll('.pollen');
        this.startTime = null;
      },

      tick: function (time) {
        if (!this.startTime) this.startTime = time;

        const cycle = 12000;
        const t = (time - this.startTime) % cycle;

        let x = -0.10;
        let y = 0.00;
        let rot = -4;
        let pollenOpacity = 0;
        let factVisible = false;

        // 0–2 sec: bee rests near the flower
        if (t < 2000) {
          x = -0.10;
          y = 0.00;
          rot = -4;
        }

        // 2–5 sec: bee lifts off
        else if (t < 5000) {
          const p = (t - 2000) / 3000;

          x = -0.10 + (0.32 * p);
          y = 0.00 + (0.28 * p);

          rot = -4 + (12 * p);
        }

        // 5–8 sec: bee hovers
        else if (t < 8000) {
          const p = (t - 5000) / 3000;

          x = 0.22 + Math.sin(p * Math.PI * 2) * 0.07;
          y = 0.28 + Math.sin(p * Math.PI) * 0.07;

          rot = Math.sin(p * Math.PI * 4) * 7;

          pollenOpacity = 1;
        }

        // 8–11 sec: bee returns
        else if (t < 11000) {
          const p = (t - 8000) / 3000;

          x = -0.10 + (0.32 * (1 - p));
          y = 0.28 - (0.28 * p);

          rot = 8 - (12 * p);

          pollenOpacity = 1 - p;
        }

        // 11–12 sec: bee lands and fact appears
        else {
          x = -0.10;
          y = 0.00;
          rot = -4;

          factVisible = true;
        }

        this.el.setAttribute(
          'position',
          `${x} ${y} 0.08`
        );

        this.el.setAttribute(
          'rotation',
          `0 0 ${rot}`
        );

        this.pollen.forEach(p => {
          p.setAttribute(
            'material',
            `color: #FFD84D; opacity: ${pollenOpacity}; transparent: true`
          );
        });

        if (this.fact) {
          this.fact.setAttribute('visible', factVisible);
        }
      }
    });
  </script>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="bee" src="bee.png">
    <img id="flower" src="cornflower.png">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- CORNFLOWER -->
    <a-image
      src="#flower"
      position="0 -0.11 0.02"
      width="0.78"
      height="0.78"
      material="shader: flat; transparent: true; alphaTest: 0.1;"
      animation__sway="
        property: rotation;
        from: 0 0 -1.2;
        to: 0 0 1.2;
        dur: 1800;
        dir: alternate;
        loop: true;
        easing: easeInOutSine;">
    </a-image>


    <!-- BEE RIG -->
    <a-entity
      id="beeRig"
      bee-flight>

      <a-image
        src="#bee"
        width="0.42"
        height="0.32"
        material="shader: flat; transparent: true; alphaTest: 0.1;">
      </a-image>


      <!-- POLLEN PARTICLES -->
      <a-circle
        class="pollen"
        radius="0.009"
        position="-0.08 -0.07 0.02"
        material="color: #FFD84D; opacity: 0; transparent: true">
      </a-circle>

      <a-circle
        class="pollen"
        radius="0.008"
        position="-0.04 -0.09 0.02"
        material="color: #FFD84D; opacity: 0; transparent: true">
      </a-circle>

      <a-circle
        class="pollen"
        radius="0.007"
        position="0.01 -0.08 0.02"
        material="color: #FFD84D; opacity: 0; transparent: true">
      </a-circle>

      <a-circle
        class="pollen"
        radius="0.006"
        position="0.06 -0.05 0.02"
        material="color: #FFD84D; opacity: 0; transparent: true">
      </a-circle>

    </a-entity>


    <!-- FACT PANEL -->
    <a-entity
      id="factGroup"
      visible="false">

      <a-plane
        position="0 -0.57 0.07"
        width="1.00"
        height="0.18"
        material="
          color: #ffffff;
          opacity: 0.88;
          transparent: true;">
      </a-plane>

      <a-text
        value="Cornflowers provide nectar for bees and other pollinators."
        color="#111111"
        align="center"
        width="1.10"
        position="0 -0.57 0.08">
      </a-text>

    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
