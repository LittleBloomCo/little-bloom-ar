<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>

  <script>
    AFRAME.registerComponent('bee-flight-3d', {
      init: function () {
        this.fact = document.querySelector('#factGroup');
        this.startTime = null;
      },

      tick: function (time) {
        if (!this.startTime) this.startTime = time;

        const cycle = 12000;
        const t = (time - this.startTime) % cycle;

        let x = -0.10;
        let y = 0.00;
        let z = 0.10;
        let rotZ = -8;
        let factVisible = false;

        // 0–2 sec: bee resting
        if (t < 2000) {
          x = -0.10;
          y = 0.00;
          z = 0.10;
          rotZ = -8;
        }

        // 2–5 sec: lift off
        else if (t < 5000) {
          const p = (t - 2000) / 3000;
          x = -0.10 + (0.32 * p);
          y = 0.00 + (0.28 * p);
          z = 0.10;
          rotZ = -8 + (16 * p);
        }

        // 5–8 sec: hover
        else if (t < 8000) {
          const p = (t - 5000) / 3000;
          x = 0.22 + Math.sin(p * Math.PI * 2) * 0.07;
          y = 0.28 + Math.sin(p * Math.PI) * 0.07;
          z = 0.10;
          rotZ = Math.sin(p * Math.PI * 4) * 8;
        }

        // 8–11 sec: return
        else if (t < 11000) {
          const p = (t - 8000) / 3000;
          x = -0.10 + (0.32 * (1 - p));
          y = 0.28 - (0.28 * p);
          z = 0.10;
          rotZ = 8 - (16 * p);
        }

        // 11–12 sec: fact appears
        else {
          x = -0.10;
          y = 0.00;
          z = 0.10;
          rotZ = -8;
          factVisible = true;
        }

        this.el.setAttribute('position', `${x} ${y} ${z}`);
        this.el.setAttribute('rotation', `0 0 ${rotZ}`);

        if (this.fact) {
          this.fact.setAttribute('visible', factVisible);
        }
      }
    });
  </script>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="beeModel" src="bee.glb"></a-asset-item>
    <a-asset-item id="flowerModel" src="cornflower.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- lighting -->
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- 3D flower -->
    <a-gltf-model
      id="flower3d"
      src="#flowerModel"
      position="0 -0.12 0.02"
      rotation="0 0 0"
      scale="0.18 0.18 0.18"
      animation__sway="
        property: rotation;
        from: 0 0 -1.5;
        to: 0 0 1.5;
        dur: 1800;
        dir: alternate;
        loop: true;
        easing: easeInOutSine;">
    </a-gltf-model>

    <!-- 3D bee -->
    <a-entity id="beeRig3d" bee-flight-3d>
      <a-gltf-model
        id="bee3d"
        src="#beeModel"
        position="0 0 0"
        rotation="0 90 0"
        scale="0.035 0.035 0.035">
      </a-gltf-model>
    </a-entity>

    <!-- fact panel -->
    <a-entity id="factGroup" visible="false">
      <a-plane
        position="0 -0.57 0.07"
        width="1.00"
        height="0.18"
        material="color: #ffffff; opacity: 0.88; transparent: true;">
      </a-plane>

      <a-text
        value="Cornflowers provide nectar for bees and other pollinators."
        color="#111111"
        align="center"
        width="1.10"
        position="0 -0.57 0.08">
      </a-text>
    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
